="animation-delay:-0.01s;animation-duration:4.4s"/><circle class="tw" cx="1019" cy="230" r="0.6" fill="#fff" style="animation-delay:-2.50s;animation-duration:4.5s"/><circle class="tw" cx="997" cy="291" r="1" fill="#fff" style="animation-delay:-1.06s;animation-duration:2.9s"/><circle class="tw" cx="23" cy="242" r="0.8" fill="#fff" style="animation-delay:-2.78s;animation-duration:4.9s"/><circle class="tw" cx="1157" cy="247" r="0.8" fill="#fff" style="animation-delay:-1.33s;animation-duration:4.9s"/><circle class="tw" cx="966" cy="88" r="1.3" fill="#fff" style="animation-delay:-1.14s;animation-duration:5.1s"/><circle class="tw" cx="641" cy="71" r="0.8" fill="#fff" style="animation-delay:-1.45s;animation-duration:5.0s"/><circle class="tw" cx="1101" cy="221" r="0.6" fill="#fff" style="animation-delay:-3.96s;animation-duration:5.4s"/><circle class="tw" cx="1063" cy="93" r="1.3" fill="#fff" style="animation-delay:-2.05s;animation-duration:4.9s"/><circle class="tw" cx="48" cy="186" r="1.3" fill="#fff" style="animation-delay:-3.48s;animation-duration:2.7s"/><circle class="tw" cx="305" cy="152" r="1.3" fill="#fff" style="animation-delay:-1.01s;animation-duration:4.7s"/><circle class="tw" cx="441" cy="205" r="0.8" fill="#fff" style="animation-delay:-1.34s;animation-duration:5.2s"/><circle class="tw" cx="1011" cy="249" r="1.3" fill="#fff" style="animation-delay:-2.56s;animation-duration:2.9s"/><circle class="tw" cx="888" cy="81" r="0.8" fill="#fff" style="animation-delay:-0.50s;animation-duration:3.8s"/><circle class="tw" cx="803" cy="69" r="0.8" fill="#fff" style="animation-delay:-3.90s;animation-duration:4.2s"/><circle class="tw" cx="833" cy="237" r="0.8" fill="#fff" style="animation-delay:-1.07s;animation-duration:3.4s"/><circle class="tw" cx="302" cy="200" r="1.3" fill="#fff" style="animation-delay:-3.73s;animation-duration:6.0s"/><circle class="tw" cx="58" cy="214" r="0.6" fill="#fff" style="animation-delay:-3.48s;animation-duration:3.2s"/><circle class="tw" cx="428" cy="1