t="indefinite"/></circle><g class="up" style="animation-delay:0.50s"><text x="170" y="223" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#F2F6FF" opacity="1">Java &amp; Spring Boot</text><text x="170" y="243" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="2">now</text></g><circle cx="380" cy="115" r="11" fill="#0B1226" stroke="#00E5FF" stroke-width="2"/><circle cx="380" cy="115" r="4" fill="#00E5FF"/><g class="up" style="animation-delay:0.85s"><text x="380" y="65" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#F2F6FF" opacity="1">Node.js &amp; backend architecture</text><text x="380" y="85" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="2">now</text></g><circle cx="600" cy="180" r="11" fill="#0B1226" stroke="#00E5FF" stroke-width="2"/><circle cx="600" cy="180" r="4" fill="#00E5FF"/><g class="up" style="animation-delay:1.20s"><text x="600" y="228" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#F2F6FF" opacity="1">LLMs + RAG</text><text x="600" y="248" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="2">in the lab</text></g><circle cx="815" cy="115" r="11" fill="#0B1226" stroke="#00E5FF" stroke-width="2"/><circle cx="815" cy="115" r="4" fill="#00E5FF"/><g class="up" style="animation-delay:1.55s"><text x="815" y="65" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#F2F6FF" opacity="1">System design</text><text x="815" y="85" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="2">next</text></g><circle cx=