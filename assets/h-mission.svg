tion-delay:-2.44s;animation-duration:4.4s"/><circle class="tw" cx="881" cy="66" r="1" fill="#fff" style="animation-delay:-1.23s;animation-duration:4.0s"/><circle class="tw" cx="936" cy="81" r="0.8" fill="#fff" style="animation-delay:-1.92s;animation-duration:4.9s"/><circle class="tw" cx="415" cy="27" r="1" fill="#fff" style="animation-delay:-2.26s;animation-duration:3.7s"/><circle class="tw" cx="279" cy="118" r="0.6" fill="#fff" style="animation-delay:-2.30s;animation-duration:5.7s"/><circle class="tw" cx="891" cy="37" r="0.6" fill="#fff" style="animation-delay:-0.41s;animation-duration:4.5s"/><circle class="tw" cx="144" cy="123" r="1" fill="#fff" style="animation-delay:-1.41s;animation-duration:3.0s"/><circle class="tw" cx="1139" cy="82" r="0.8" fill="#fff" style="animation-delay:-0.12s;animation-duration:4.5s"/></g><rect x=".5" y=".5" width="1199" height="123" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/><clipPath id="gc9"><rect x="14" y="14" width="1172" height="96" rx="18"/></clipPath><g clip-path="url(#gc9)"><rect x="14" y="14" width="1172" height="96" fill="#0A1124" fill-opacity=".2"/><g filter="url(#frost)"><circle class="o1" cx="90" cy="62" r="180" fill="url(#orbC)" opacity="0.55"/><circle class="o2" cx="1120" cy="62" r="220" fill="url(#orbV)" opacity="0.6"/></g><rect x="14" y="14" width="1172" height="96" fill="url(#glassFill)"/><rect x="14" y="14" width="1172" height="96" filter="url(#noise)"/><rect class="shine" style="animation-delay:2.9s" x="-246" y="-26" width="160" height="176" fill="url(#shineG)" transform="skewX(-18)"/></g><rect x="14" y="14" width="1172" height="96" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M32 15H1168" stroke="#fff" stroke-opacity=".4" stroke-width="1"/><text x="1070" y="100" text-anchor="end" font-family="'Segoe UI Variable Display','Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="100" font-weight="800" fill="none" stroke="#fff" stroke-opacity=".08">▲</text><rect x="44" y="36" width="4" height="52" rx="2" fill="url(#neonV)" filter="url(#glow)"/><text x="70" y="66" font-family="'Segoe UI Variable Display','Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#F2F6FF" letter-spacing="1.5" class="up">Current mission</text><text x="71" y="92" font-size="14" fill="#AEB9CC" class="up" style="animation-delay:.25s"><tspan fill="#00E5FF">//</tspan> what I'm actively chasing</text><rect class="eq" x="1100" y="44" width="5" height="36" rx="2" fill="url(#neonV)" opacity=".85" style="animation-delay:-0.75s;animation-duration:1.40s"/><rect class="eq" x="1111" y="44" width="5" height="36" rx="2" fill="url(#neonV)" opacity=".85" style="animation-delay:-0.86s;animation-duration:1.16s"/><rect class="eq" x="1122" y="44" width="5" height="36" rx="2" fill="url(#neonV)" opacity=".85" style="animation-delay:-0.08s;animation-duration:1.17s"/><rect class="eq" x="1133" y="44" width="5" height="36" rx="2" fill="url(#neonV)" opacity=".85" style="animation-delay:-0.20s;animation-duration:1.17s"/><rect class="eq" x="1144" y="44" width="5" height="36" rx="2" fill="url(#neonV)" opacity=".85" style="animation-delay:-0.39s;animation-duration:1.15s"/><rect class="eq" x="1155" y="44" width="5" height="36" rx="2" fill="url(#neonV)" opacity=".85" style="animation-delay:-0.22s;animation-duration:1.29s"/>
